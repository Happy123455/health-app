<!-- id=s08 duration=6.4 -->
<style>
  #s08-watch { left: 290px; top: 470px; width: 500px; height: 500px; }
  #s08-case { inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(255,255,255,0.04) 60%); border: 1.5px solid rgba(255,255,255,0.3); box-shadow: 0 50px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.35); backdrop-filter: blur(24px); }
  #s08-face { left: 70px; top: 70px; width: 360px; height: 360px; border-radius: 50%; background: #05090a; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: inset 0 0 40px rgba(127,216,208,0.18); }
  .s08-card { position: absolute; left: 90px; width: 900px; padding: 30px 36px; }
  .s08-k { font-weight: 600; font-size: 24px; letter-spacing: 0.2em; text-transform: uppercase; color: #7fd8d0; }
  .s08-v { font-weight: 600; font-size: 40px; color: #f1f6f5; margin-top: 8px; }
</style>
<div id="s08-wrap" class="wrap">
  <div class="head">
    <span id="s08-eyebrow" class="eyebrow block">Galaxy Watch</span>
    <span id="s08-title" class="title block" style="margin-top: 22px">Your wrist is in on it.</span>
  </div>
  <div id="s08-watch" class="abs">
    <div id="s08-case" class="abs"></div>
    <svg id="s08-bezel" class="abs" style="left: 0; top: 0" width="500" height="500" viewBox="0 0 500 500"></svg>
    <div id="s08-face" class="abs">
      <span class="s08-k" style="font-size: 20px">How groggy?</span>
      <span id="s08-pct" style="font-weight: 700; font-size: 120px; letter-spacing: -0.04em; color: #f1f6f5; line-height: 1.05">0%</span>
      <span class="sub" style="font-size: 24px">turn the bezel</span>
    </div>
  </div>
  <div id="s08-c1" class="s08-card glass" style="top: 1060px">
    <span class="s08-k block">Smart alarm</span>
    <span class="s08-v block">Rings in light sleep, inside your wake window.</span>
    <svg id="s08-hyp" width="828" height="90" viewBox="0 0 828 90" style="margin-top: 16px; display: block">
      <path id="s08-hyp-path" d="M0,20 H90 V60 H200 V80 H300 V40 H420 V80 H520 V60 H640 V20 H700 V40 H828" fill="none" stroke="#7fd8d0" stroke-width="5" stroke-linejoin="round" />
      <circle id="s08-ring" cx="700" cy="20" r="12" fill="#ffb05c" />
    </svg>
  </div>
  <div id="s08-c2" class="s08-card glass" style="top: 1390px">
    <span class="s08-k block">Water</span>
    <span class="s08-v block">One tap on the watch = one glass.</span>
    <div id="s08-glasses" style="display: flex; gap: 22px; margin-top: 18px"></div>
  </div>
  <div id="s08-c3" class="abs" style="left: 90px; top: 1660px; display: flex; gap: 16px">
    <span class="chip"><span class="dot"></span>Health Connect ✓</span>
    <span class="chip"><span class="dot"></span>Watch ✓</span>
    <span class="chip"><span class="dot"></span>Gemini ✓</span>
  </div>
</div>
<script>
  var NS = "http://www.w3.org/2000/svg", bz = $("#s08-bezel");
  for (var i = 0; i < 60; i++) {
    var a = i / 60 * Math.PI * 2, r1 = 232, r2 = i % 5 ? 214 : 200;
    var l = document.createElementNS(NS, "line");
    l.setAttribute("x1", 250 + Math.sin(a) * r1); l.setAttribute("y1", 250 - Math.cos(a) * r1);
    l.setAttribute("x2", 250 + Math.sin(a) * r2); l.setAttribute("y2", 250 - Math.cos(a) * r2);
    l.setAttribute("stroke", i % 5 ? "rgba(255,255,255,0.35)" : "#7fd8d0"); l.setAttribute("stroke-width", i % 5 ? 3 : 6); l.setAttribute("stroke-linecap", "round");
    bz.appendChild(l);
  }
  for (var g = 0; g < 8; g++) {
    var d = document.createElement("div");
    d.style.cssText = "width:62px;height:80px;border-radius:6px 6px 14px 14px;border:3px solid rgba(255,255,255,0.45);position:relative;overflow:hidden";
    var w = document.createElement("div"); w.id = "s08-w" + g;
    w.style.cssText = "position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(#7fd8f0,#3aa0d8)";
    d.appendChild(w); $("#s08-glasses").appendChild(d);
  }
  var S = "sine.inOut";
  tl.fromTo("#s08-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
  tl.fromTo("#s08-eyebrow, #s08-title", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: S, stagger: 0.12 }, 0.2);
  tl.fromTo("#s08-watch", { y: 120, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 1.0, ease: "expo.out" }, 0.3);
  // The bezel clicks round; the grogginess score follows it.
  tl.fromTo("#s08-bezel", { rotation: 0 }, { rotation: 66, duration: 1.4, ease: "steps(11)" }, 1.0);
  var c = { v: 0 };
  tl.to(c, { v: 37, duration: 1.4, ease: "steps(11)", onUpdate: function () { $("#s08-pct").textContent = Math.round(c.v) + "%"; } }, 1.0);
  // Glass cards float up slowly.
  tl.fromTo("#s08-c1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: S }, 2.0);
  tl.fromTo("#s08-hyp-path", { drawSVG: "0%" }, { drawSVG: "100%", duration: 1.2, ease: "power1.inOut" }, 2.3);
  tl.fromTo("#s08-ring", { scale: 0, transformOrigin: "700px 20px" }, { scale: 1, duration: 0.4, ease: "back.out(2.5)" }, 3.3);
  tl.fromTo("#s08-ring", { opacity: 1 }, { opacity: 0.3, duration: 0.25, yoyo: true, repeat: 5, ease: S }, 3.7);
  tl.fromTo("#s08-c2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: S }, 2.8);
  for (var k = 0; k < 8; k++) tl.fromTo("#s08-w" + k, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: k < 3 ? 1 : 0, duration: 0.4, ease: "power2.out" }, 3.3 + k * 0.18);
  tl.fromTo("#s08-c3 .chip", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: S, stagger: 0.15 }, 3.8);
  tl.to("#s08-watch", { y: -14, duration: 2.4, ease: S }, 3.0);
  tl.to("#s08-wrap", { opacity: 0, duration: 0.4 }, 6.0);
</script>
