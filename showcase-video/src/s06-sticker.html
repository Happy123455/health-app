<!-- id=s06 duration=7 -->
<style>
  #s06-ground { inset: -90px; background: #10171d; }
  #s06-cam { left: 0; top: 0; width: 2160px; height: 3840px; transform-origin: 0 0; }
  #s06-dots { inset: 0; background-image: radial-gradient(rgba(255,255,255,0.10) 1.6px, transparent 1.8px); background-size: 40px 40px; }
  #s06 .lift { box-shadow: 0 30px 70px rgba(0,0,0,0.55); }
  .s06-sticker { position: absolute; border-radius: 50%; border: 12px solid #fff; box-shadow: 0 24px 50px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; }
  .s06-cap { position: absolute; font-weight: 700; font-size: 44px; color: #f1f6f5; letter-spacing: -0.01em; }
  .s06-small { position: absolute; font-weight: 500; font-size: 28px; color: #8d9aa3; letter-spacing: 0.12em; text-transform: uppercase; }
  .s06-tile { position: absolute; width: 320px; height: 320px; border-radius: 28px; background: #263440; border: 4px solid #3c4f5e; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
  .s06-tile .z { position: absolute; left: 28px; top: 22px; font-weight: 600; font-size: 34px; color: #8d9aa3; }
  .s06-tile .sym { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-weight: 900; font-size: 150px; color: #f1f6f5; letter-spacing: -0.04em; }
  .s06-tile .nm { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font-weight: 500; font-size: 30px; color: #b8c4cb; }
  .s06-stamp { position: absolute; font-weight: 900; font-size: 120px; letter-spacing: -0.04em; padding: 6px 30px; border-radius: 20px; }
  .s06-bar { position: absolute; bottom: 0; width: 170px; border-radius: 16px 16px 0 0; }
  #s06 svg path { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .s06-big { position: absolute; font-weight: 900; font-size: 172px; line-height: 0.92; letter-spacing: -0.05em; color: #fff; }
</style>
<div id="s06-wrap" class="wrap">
  <div id="s06-ground" class="abs"></div>
  <div id="s06-cam" class="abs">
    <div id="s06-dots" class="abs"></div>
    <!-- Page 1 (0,0): the meal screen and its pairing card -->
    <div id="s06-phone" class="phone" style="left: 305px; top: 456px">
      <div class="screen"><img src="assets/screens/16-pairing.png" alt="" /></div>
      <div class="glare"></div>
    </div>
    <div id="s06-hole" class="hole"></div>
    <div id="s06-lift" class="lift"></div>
    <span id="s06-p1" class="s06-small" style="left: 120px; top: 1180px">From your dinner photo</span>
    <!-- Page 2 (1080,0): chai blocks iron -->
    <span class="s06-small" style="left: 1200px; top: 220px">01 · with chai</span>
    <div id="s06-chai" class="s06-sticker" style="left: 1400px; top: 340px; width: 400px; height: 400px; background: #f1dcc3"><span style="font-size: 220px; line-height: 1">☕</span></div>
    <span id="s06-chai-cap" class="s06-cap" style="left: 1200px; top: 790px">Tannins in tea</span>
    <svg class="abs" style="left: 1080px; top: 0" width="1080" height="1920" viewBox="0 0 1080 1920"><path id="s06-arr1" d="M520,880 C520,980 520,1040 540,1110 M500,1070 L540,1112 L580,1070" stroke="#FF5A36" /></svg>
    <div id="s06-fe1" class="s06-tile" style="left: 1460px; top: 1150px"><span class="z">26</span><span class="sym">Fe</span><span class="nm">Iron</span></div>
    <div id="s06-st1" class="s06-stamp" style="left: 1380px; top: 1530px; background: #FF5A36; color: #fff">−50%</div>
    <span id="s06-st1c" class="s06-small" style="left: 1400px; top: 1700px">iron absorbed</span>
    <!-- Page 3 (0,1920): lemon boosts iron + bar chart -->
    <span class="s06-small" style="left: 120px; top: 2140px">02 · with lemon</span>
    <div id="s06-lemon" class="s06-sticker" style="left: 120px; top: 2260px; width: 340px; height: 340px; background: #fff3a8"><span style="font-size: 190px; line-height: 1">🍋</span></div>
    <span id="s06-lemon-cap" class="s06-cap" style="left: 120px; top: 2640px">Vitamin C</span>
    <svg class="abs" style="left: 0; top: 1920px" width="1080" height="1920" viewBox="0 0 1080 1920"><path id="s06-arr2" d="M480,520 C560,520 600,520 650,520 M610,480 L652,520 L610,560" stroke="#7fd8d0" /></svg>
    <div id="s06-fe2" class="s06-tile" style="left: 680px; top: 2280px"><span class="z">26</span><span class="sym">Fe</span><span class="nm">Iron</span></div>
    <div id="s06-chart" class="abs" style="left: 140px; top: 2900px; width: 800px; height: 560px; border-bottom: 4px solid #3c4f5e">
      <div id="s06-b1" class="s06-bar" style="left: 40px; height: 90px; background: #FF5A36"></div>
      <div id="s06-b2" class="s06-bar" style="left: 315px; height: 180px; background: #5b6d7a"></div>
      <div id="s06-b3" class="s06-bar" style="left: 590px; height: 540px; background: #7fd8d0"></div>
    </div>
    <span class="s06-small" style="left: 175px; top: 3480px">+ chai</span>
    <span class="s06-small" style="left: 460px; top: 3480px">plain</span>
    <span class="s06-small" style="left: 725px; top: 3480px">+ lemon</span>
    <div id="s06-x3" class="s06-stamp" style="left: 690px; top: 2740px; color: #7fd8d0">×<span id="s06-x3n">1</span></div>
    <!-- Page 4 (1080,1920): title card -->
    <div class="abs" style="left: 1170px; top: 2660px; width: 24px; height: 380px; background: #FF5A36"></div>
    <span class="s06-big" style="left: 1230px; top: 2650px">Chai<span class="block">later.</span></span>
    <span class="s06-big" style="left: 1230px; top: 3020px; color: #7fd8d0">Lemon<span class="block">now.</span></span>
    <span class="s06-small" style="left: 1236px; top: 3420px">Pairing tips on every meal</span>
  </div>
</div>
<script>
  var IMG = "assets/screens/16-pairing.png";
  lift($("#s06-lift"), 305, 456, IMG, 30, 126, 662, 368);
  hole($("#s06-hole"), 305, 456, 30, 126, 662, 368);
  var CAM = "power3.inOut";

  tl.fromTo("#s06-wrap", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
  // Card lifts off and becomes a sticker (thick white outline, slight tilt, bigger).
  tl.fromTo("#s06-hole", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.4);
  tl.fromTo("#s06-lift", { z: 0, transformPerspective: 1600 }, { z: 200, duration: 0.45, ease: "expo.out" }, 0.4);
  tl.to("#s06-phone, #s06-hole", { y: 1100, opacity: 0, duration: 0.7, ease: "power3.in" }, 0.85);
  tl.to("#s06-lift", { z: 0, y: 120, scale: 2.1, rotation: -3, boxShadow: "0 0 0 10px #ffffff, 0 30px 70px rgba(0,0,0,0.55)", duration: 0.7, ease: "back.out(1.4)" }, 0.9);
  tl.fromTo("#s06-p1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.2);

  // Camera: one continuous move across the canvas.
  tl.to("#s06-cam", { x: -1080, y: 0, duration: 0.6, ease: CAM }, 1.5);
  tl.fromTo("#s06-chai", { scale: 0, rotation: -20 }, { scale: 1, rotation: 6, duration: 0.5, ease: "back.out(2)" }, 1.85);
  tl.fromTo("#s06-chai-cap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 2.1);
  tl.fromTo("#s06-arr1", { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.35, ease: "power2.out" }, 2.25);
  tl.fromTo("#s06-fe1", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 2.45);
  tl.fromTo("#s06-st1", { scale: 2, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.3, ease: "power4.out" }, 2.75);
  tl.fromTo("#s06-st1c", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.9);

  tl.to("#s06-cam", { x: 0, y: -1920, duration: 0.65, ease: CAM }, 3.15);
  tl.fromTo("#s06-lemon", { scale: 0, rotation: 20 }, { scale: 1, rotation: -6, duration: 0.5, ease: "back.out(2)" }, 3.5);
  tl.fromTo("#s06-lemon-cap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 3.7);
  tl.fromTo("#s06-arr2", { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.3, ease: "power2.out" }, 3.8);
  tl.fromTo("#s06-fe2", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 3.95);
  tl.fromTo("#s06-b1, #s06-b2, #s06-b3", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 4.0);
  var n = { v: 1 };
  tl.fromTo("#s06-x3", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.3);
  tl.to(n, { v: 3, duration: 0.6, ease: "steps(2)", onUpdate: function () { $("#s06-x3n").textContent = Math.round(n.v); } }, 4.35);

  tl.to("#s06-cam", { x: -1080, y: -1920, duration: 0.6, ease: CAM }, 5.0);
  // Pull out to reveal the whole board.
  tl.to("#s06-cam", { x: 0, y: 0, scale: 0.5, duration: 0.8, ease: CAM }, 5.85);
  tl.to("#s06-wrap", { opacity: 0, duration: 0.35 }, 6.65);
</script>
