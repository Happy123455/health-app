<!-- id=s05 duration=7 -->
<style>
  #s05-ground { inset: -90px; background: radial-gradient(1000px 1000px at 50% 62%, #16202a, #080c10 75%); }
  #s05 .lift { box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  #s05-flat { transform-origin: 50% 50%; }
  #s05-pill { left: 0; top: 0; }
  .s05-legend { position: absolute; left: 0; right: 0; top: 1600px; text-align: center; }
</style>
<div id="s05-wrap" class="wrap">
  <div id="s05-ground" class="abs"></div>
  <div class="head">
    <span id="s05-eyebrow" class="eyebrow block">Muscle map · this week</span>
    <span id="s05-title" class="title block" style="margin-top: 22px">Know what to train next.</span>
  </div>
  <div id="s05-phone" class="phone" style="left: 305px; top: 456px">
    <div class="screen"><img src="assets/screens/09-muscles.png" alt="" /></div>
    <div class="glare"></div>
  </div>
  <div id="s05-hole" class="hole"></div>
  <div id="s05-flat" class="abs"><div id="s05-lift" class="lift" style="position: relative; left: 0; top: 0"></div></div>
  <svg id="s05-svg" class="abs" style="left: 0; top: 0" width="1080" height="1920" viewBox="0 0 1080 1920">
    <g id="s05-grid" stroke="rgba(127,216,208,0.22)" stroke-width="1.5" fill="none"></g>
    <g id="s05-towers"></g>
    <g id="s05-labels" font-family="Inter" font-weight="600" font-size="30" fill="#c9d6d4"></g>
  </svg>
  <div id="s05-pill" class="abs"><span class="chip" style="border-color: rgba(255,176,92,0.6)"><span class="dot" style="background:#ffb05c"></span>Chest · train next</span></div>
  <div class="s05-legend"><span id="s05-legend" class="sub">Tower height = training this week · green = recovered</span></div>
</div>
<script>
  var IMG = "assets/screens/09-muscles.png";
  // Lift the body map, inside a wrapper so the wrapper's scaleY lands after the lift's 45° turn (= isometric floor).
  var fl = $("#s05-flat"), li = $("#s05-lift");
  lift(li, 0, 0, IMG, 200, 510, 320, 620);
  fl.style.left = (305 + 13 + 200 * K) + "px"; fl.style.top = (456 + 13 + 510 * K) + "px";
  fl.style.width = li.style.width; fl.style.height = li.style.height;
  li.style.left = "0px"; li.style.top = "0px";
  hole($("#s05-hole"), 305, 456, 200, 510, 320, 620);

  // True isometric projection (30°): grid unit u px, origin O.
  var O = { x: 540, y: 1120 }, u = 60, C = Math.cos(Math.PI / 6);
  function P(gx, gy, z) { return [O.x + (gx - gy) * u * C, O.y + (gx + gy) * u * 0.5 - (z || 0)]; }
  function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
  var SVGNS = "http://www.w3.org/2000/svg";
  var grid = $("#s05-grid");
  for (var i = -7; i <= 7; i++) {
    var a = P(i, -3), b = P(i, 4), c = P(-7, Math.max(-3, Math.min(4, i))), d = P(7, Math.max(-3, Math.min(4, i)));
    if (i < -3 || i > 4) { c = d = null; }
    var l1 = document.createElementNS(SVGNS, "line"); l1.setAttribute("x1", a[0]); l1.setAttribute("y1", a[1]); l1.setAttribute("x2", b[0]); l1.setAttribute("y2", b[1]); grid.appendChild(l1);
    if (!c) continue;
    var l2 = document.createElementNS(SVGNS, "line"); l2.setAttribute("x1", c[0]); l2.setAttribute("y1", c[1]); l2.setAttribute("x2", d[0]); l2.setAttribute("y2", d[1]); grid.appendChild(l2);
  }
  // Training load this week (from the app's "desk day vs training" chart). Chest is the gap.
  // One row along the gx axis, back to front, so no tower hides a label.
  var T = [
    { name: "Chest", gx: -6.3, gy: -0.7, v: 0.1, warm: true },
    { name: "Core", gx: -4.2, gy: -0.7, v: 0.22 },
    { name: "Hams", gx: -2.1, gy: -0.7, v: 0.55 },
    { name: "Glutes", gx: 0, gy: -0.7, v: 0.75 },
    { name: "Quads", gx: 2.1, gy: -0.7, v: 0.85 },
    { name: "Calves", gx: 4.2, gy: -0.7, v: 1.0 },
  ];
  var S = 1.4, MAXH = 380;
  var towers = $("#s05-towers"), labels = $("#s05-labels");
  T.forEach(function (t) {
    t.h = 0;
    t.g = document.createElementNS(SVGNS, "g"); towers.appendChild(t.g);
    ["top", "right", "left"].forEach(function (f) { var p = document.createElementNS(SVGNS, "polygon"); t[f] = p; t.g.appendChild(p); });
    var col = t.warm ? ["#ffd59c", "#ffb05c", "#b97a36"] : ["#a6f3ea", "#46b9ad", "#2a7f78"];
    t.top.setAttribute("fill", col[0]); t.right.setAttribute("fill", col[1]); t.left.setAttribute("fill", col[2]);
    // Label lying on the floor in front of the tower, skewed into iso space.
    var base = P(t.gx, t.gy + S + 0.9);
    var tx = document.createElementNS(SVGNS, "text");
    tx.setAttribute("transform", "matrix(" + C + ",0.5," + (-C) + ",0.5," + base[0] + "," + base[1] + ")");
    tx.textContent = t.name; t.label = tx; labels.appendChild(tx);
  });
  function draw() {
    T.forEach(function (t) {
      var h = t.h * MAXH;
      var A = P(t.gx, t.gy), B = P(t.gx + S, t.gy), Cc = P(t.gx + S, t.gy + S), D = P(t.gx, t.gy + S);
      var A2 = P(t.gx, t.gy, h), B2 = P(t.gx + S, t.gy, h), C2 = P(t.gx + S, t.gy + S, h), D2 = P(t.gx, t.gy + S, h);
      t.top.setAttribute("points", pts([A2, B2, C2, D2]));
      t.right.setAttribute("points", pts([B, Cc, C2, B2]));
      t.left.setAttribute("points", pts([D, Cc, C2, D2]));
    });
    var c = T[0], top = P(c.gx + S / 2, c.gy + S / 2, c.h * MAXH);
    $("#s05-pill").style.left = (top[0] - 150) + "px"; $("#s05-pill").style.top = (top[1] - 130) + "px";
  }
  draw();

  tl.fromTo("#s05-wrap", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
  tl.fromTo("#s05-eyebrow, #s05-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out", stagger: 0.1 }, 0.3);
  tl.fromTo("#s05-svg", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  // Body map lifts out, turns 45° and lies down flat onto the isometric floor.
  tl.fromTo("#s05-hole", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.45);
  tl.fromTo("#s05-flat", { z: 0, transformPerspective: 1600 }, { z: 160, duration: 0.45, ease: "expo.out" }, 0.45);
  tl.to("#s05-phone, #s05-hole", { y: 1100, opacity: 0, duration: 0.8, ease: "power3.in" }, 0.85);
  tl.to("#s05-flat", { z: 0, y: 1120 - (456 + 13 + 820 * K), scaleY: 0.577, duration: 0.9, ease: "expo.inOut" }, 0.9);
  tl.to("#s05-lift", { rotation: 45, scale: 1.7, duration: 0.9, ease: "expo.inOut" }, 0.9);
  tl.to("#s05-svg", { opacity: 1, duration: 0.5 }, 1.55);
  tl.fromTo("#s05-grid", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.55);
  tl.to("#s05-flat", { opacity: 0, duration: 0.5 }, 1.8);
  // Towers grow: base lands, walls rise with overshoot, staggered back to front.
  T.forEach(function (t, i) {
    tl.to(t, { h: t.v, duration: 0.7, ease: "back.out(1.7)", onUpdate: draw }, 2.0 + i * 0.16);
  });
  tl.fromTo("#s05-labels", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.3);
  tl.fromTo("#s05-pill", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 3.6);
  tl.to(T[0], { h: 0.32, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, onUpdate: draw }, 4.1);
  tl.fromTo("#s05-legend", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.9);
  // Parallel camera slide (no rotation), as isometric pieces do.
  tl.fromTo("#s05-svg", { x: 30 }, { x: -30, duration: 6, ease: "sine.inOut" }, 1.0);
  tl.to("#s05-wrap", { opacity: 0, duration: 0.4 }, 6.6);
</script>
